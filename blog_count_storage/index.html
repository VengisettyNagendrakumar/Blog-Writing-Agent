<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      let initialized = false;
      let storageKey = null;
      let lastCount = null;

      function send(type, data) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type }, data),
          "*"
        );
      }

      function report(count, error) {
        send("streamlit:setComponentValue", {
          value: { count, error: error ? String(error) : null },
          dataType: "json"
        });
      }

      window.addEventListener("message", (event) => {
        if (event.data.type !== "streamlit:render") return;

        const args = event.data.args;
        if (!initialized || storageKey !== args.storage_key) {
          storageKey = args.storage_key;
          let count = args.initial_count;
          let error = null;

          try {
            const stored = window.localStorage.getItem(storageKey);
            if (stored === null) {
              window.localStorage.setItem(storageKey, String(count));
            } else {
              const parsed = Number(stored);
              if (Number.isSafeInteger(parsed) && parsed >= args.initial_count) {
                count = parsed;
              } else {
                window.localStorage.setItem(storageKey, String(count));
              }
            }
          } catch (storageError) {
            error = storageError;
          }

          initialized = true;
          lastCount = args.count;
          report(count, error);
          return;
        }

        if (
          Number.isSafeInteger(args.count) &&
          args.count >= args.initial_count &&
          args.count !== lastCount
        ) {
          lastCount = args.count;
          try {
            window.localStorage.setItem(storageKey, String(args.count));
            report(args.count, null);
          } catch (storageError) {
            report(args.count, storageError);
          }
        }
      });

      send("streamlit:componentReady", { apiVersion: 1 });
      send("streamlit:setFrameHeight", { height: 0 });
    </script>
  </head>
  <body></body>
</html>
